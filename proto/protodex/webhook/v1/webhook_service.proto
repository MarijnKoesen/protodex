syntax = "proto3";

// Protodex-native API (not part of the buf registry API): manage webhooks
// that receive audit events as CloudEvents. Instance admins only.
package protodex.webhook.v1;

import "google/protobuf/timestamp.proto";

// A subscriber of audit events.
message Webhook {
  string id = 1;
  string url = 2;
  string description = 3;
  // Exact event types or prefixes such as "protodex.label.*". Empty: all events.
  repeated string event_types = 4;
  bool active = 5;
  google.protobuf.Timestamp create_time = 6;
  google.protobuf.Timestamp update_time = 7;
}

// One queued or finished delivery of an event to a webhook.
message Delivery {
  string id = 1;
  string webhook_id = 2;
  string event_id = 3;
  // "pending", "delivered" or "failed" (retries exhausted).
  string status = 4;
  int32 attempts = 5;
  google.protobuf.Timestamp next_attempt_time = 6;
  // HTTP status of the last attempt; 0 when none or a transport error.
  int32 last_status = 7;
  string last_error = 8;
  google.protobuf.Timestamp create_time = 9;
  google.protobuf.Timestamp update_time = 10;
}

message CreateWebhookRequest {
  string url = 1;
  string description = 2;
  repeated string event_types = 3;
  // Signing secret; generated when empty. Returned only by this call.
  string secret = 4;
}

message CreateWebhookResponse {
  Webhook webhook = 1;
  // The HMAC signing secret, shown once.
  string secret = 2;
}

message ListWebhooksRequest {}

message ListWebhooksResponse {
  repeated Webhook webhooks = 1;
}

message UpdateWebhookRequest {
  string id = 1;
  // Fields that are unset are left unchanged.
  optional string url = 2;
  optional string description = 3;
  optional bool active = 4;
  // Replaces the subscriptions when update_event_types is true.
  bool update_event_types = 5;
  repeated string event_types = 6;
}

message UpdateWebhookResponse {
  Webhook webhook = 1;
}

message DeleteWebhookRequest {
  string id = 1;
}

message DeleteWebhookResponse {}

message ListDeliveriesRequest {
  string webhook_id = 1;
  // Cursor: the next_page_token of the previous response.
  string page_token = 2;
  // Maximum deliveries to return (default 50, at most 200).
  int32 page_size = 3;
}

message ListDeliveriesResponse {
  repeated Delivery deliveries = 1;
  string next_page_token = 2;
}

// WebhookService manages webhooks. Deliveries are made by a background
// worker with retries and exponential backoff.
service WebhookService {
  rpc CreateWebhook(CreateWebhookRequest) returns (CreateWebhookResponse);
  rpc ListWebhooks(ListWebhooksRequest) returns (ListWebhooksResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc UpdateWebhook(UpdateWebhookRequest) returns (UpdateWebhookResponse);
  rpc DeleteWebhook(DeleteWebhookRequest) returns (DeleteWebhookResponse);
  rpc ListDeliveries(ListDeliveriesRequest) returns (ListDeliveriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}
