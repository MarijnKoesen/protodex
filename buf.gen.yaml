# SPDX-License-Identifier: Apache-2.0
version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/marijnkoesen/protodex/gen
  disable:
    - module: buf.build/bufbuild/protovalidate
      file_option: go_package_prefix
plugins:
  - local: protoc-gen-go
    out: gen
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen
    opt: paths=source_relative
