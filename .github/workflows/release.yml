# SPDX-License-Identifier: Apache-2.0
# Release pipeline, triggered by pushing a v* tag:
#   image:   multi-arch (amd64/arm64) image -> GHCR, SBOM (BuildKit attestation
#            plus a syft SPDX SBOM attached via cosign and kept as a workflow
#            artifact), cosign keyless signature, GitHub build provenance.
#   chart:   Helm chart (deploy/helm/protodex) packaged with the tag version,
#            pushed to GHCR as an OCI artifact, cosign keyless signature,
#            GitHub build provenance.
#   release: cross-compiled binaries + SHA256SUMS, provenance attestation,
#            GitHub Release with generated changelog.
# Actions are pinned by commit SHA; dependabot keeps the pins current.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # GHCR image names must be lowercase.
  IMAGE_NAME: ghcr.io/marijnkoesen/protodex
  # Helm OCI repository; the chart lands at ${CHART_REPO}/protodex:<X.Y.Z>.
  CHART_REPO: ghcr.io/marijnkoesen/charts
  HELM_VERSION: v3.19.0

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless + attestation signing (Sigstore OIDC)
      attestations: write # actions/attest-build-provenance
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,format=long
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Go cross-compiles on the native builder (see Dockerfile); no QEMU.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          # BuildKit SBOM (syft-based scanner) + SLSA provenance stored in the
          # image index alongside the per-platform manifests.
          sbom: true
          provenance: mode=max
      - name: SBOM (syft, SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: protodex-image.spdx.json
          upload-artifact: true
          upload-release-assets: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign image and attach SBOM attestation (cosign keyless)
        env:
          IMAGE: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE"
          cosign attest --yes --type spdxjson --predicate protodex-image.spdx.json "$IMAGE"
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo '### Image'
            echo "Digest: \`${DIGEST}\`"
            echo '```'
            echo "$TAGS"
            echo '```'
            echo 'Verify:'
            echo '```sh'
            echo "cosign verify ${IMAGE_NAME}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo "gh attestation verify oci://${IMAGE_NAME}@${DIGEST} -R ${GITHUB_REPOSITORY}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  chart:
    name: chart
    # After the image so the chart's default appVersion tag already exists.
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push the chart to GHCR
      id-token: write # cosign keyless + attestation signing (Sigstore OIDC)
      attestations: write # actions/attest-build-provenance
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      # Docker credentials for cosign; helm keeps its own registry config.
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: package
        name: Package chart
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          helm lint --strict deploy/helm/protodex
          # appVersion = the git tag, which is also an image tag (see image job).
          helm package deploy/helm/protodex --version "$version" --app-version "$TAG" --destination dist
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - id: push
        name: Push chart to GHCR (OCI)
        env:
          VERSION: ${{ steps.package.outputs.version }}
          ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | helm registry login "$REGISTRY" -u "$ACTOR" --password-stdin
          out=$(helm push "dist/protodex-${VERSION}.tgz" "oci://${CHART_REPO}" 2>&1)
          echo "$out"
          digest=$(printf '%s\n' "$out" | awk '/^Digest:/ {print $2}')
          case "$digest" in sha256:*) ;; *) echo "could not parse chart digest" >&2; exit 1 ;; esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign chart (cosign keyless)
        env:
          REF: ${{ env.CHART_REPO }}/protodex@${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$REF"
      - name: Build provenance attestation (chart)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.CHART_REPO }}/protodex
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          {
            echo '### Helm chart'
            echo "\`oci://${CHART_REPO}/protodex\` version \`${VERSION}\` (\`${DIGEST}\`)"
            echo '```sh'
            echo "helm install protodex oci://${CHART_REPO}/protodex --version ${VERSION}"
            echo "cosign verify ${CHART_REPO}/protodex@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@refs/tags/v' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: release
    needs: [image, chart]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # attestation signing
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Cross-compile binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos=${target%/*}; goarch=${target#*/}
            ext=""; [ "$goos" = windows ] && ext=".exe"
            name="protodex_${VERSION#v}_${goos}_${goarch}"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X github.com/marijnkoesen/protodex/internal/version.Version=${VERSION}" \
              -o "build/$name/protodex$ext" ./cmd/protodex
            cp LICENSE NOTICE README.md "build/$name/"
            if [ "$goos" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum -- * > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Build provenance attestation (binaries)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: SBOM (syft, source)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/protodex-source.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          append_body: true
          body: |
            ### Container image
            `${{ env.IMAGE_NAME }}:${{ github.ref_name }}` (`${{ needs.image.outputs.digest }}`), linux/amd64 + linux/arm64.
            Signed with cosign keyless; SBOM and build provenance attestations are attached in the registry.
            ### Helm chart
            `helm install protodex oci://${{ env.CHART_REPO }}/protodex --version ${{ needs.chart.outputs.version }}` (`${{ needs.chart.outputs.digest }}`), signed with cosign keyless.
            Verify binaries with `sha256sum -c SHA256SUMS` and `gh attestation verify <file> -R ${{ github.repository }}`.
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/protodex-source.spdx.json
