# SPDX-License-Identifier: Apache-2.0
# Required status checks on main are the job *names* below; keep them in sync
# with CONTRIBUTING.md and docs/branch-protection.md.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: make build
      - run: make test
      - name: Coverage summary
        run: |
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  s3-contract:
    name: s3-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROTODEX_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      PROTODEX_TEST_S3_BUCKET: protodex-test
      PROTODEX_TEST_S3_ACCESS_KEY: test
      PROTODEX_TEST_S3_SECRET_KEY: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Start SeaweedFS (S3 gateway)
        run: |
          docker run -d --name seaweedfs --network host \
            chrislusf/seaweedfs:latest server -s3 -dir=/data
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:8333/ && exit 0
            sleep 1
          done
          docker logs seaweedfs
          exit 1
      - name: S3 contract tests against SeaweedFS
        run: go test -count=1 -v -run TestContractReal ./internal/blob/s3blob

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - run: make build
      - name: Install Playwright
        working-directory: e2e
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Web UI e2e tests
        working-directory: e2e
        run: |
          E2E_TOKEN="pdx_$(head -c 32 /dev/urandom | base64 | tr '+/' '-_' | tr -d '=\n')" npx playwright test

  oidc-dex:
    name: oidc-dex
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROTODEX_TEST_DEX_ISSUER: http://127.0.0.1:5556/dex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Start Dex
        run: |
          docker run -d --name dex --network host \
            -v "$PWD/internal/oidcauth/testdata/dex.yaml:/etc/dex/config.yaml:ro" \
            ghcr.io/dexidp/dex:v2.41.1 dex serve /etc/dex/config.yaml
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:5556/dex/.well-known/openid-configuration && exit 0
            sleep 1
          done
          docker logs dex
          exit 1
      - name: OIDC login against Dex
        run: go test -count=1 -v -run TestDexIntegration ./internal/oidcauth

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      # vet + golangci-lint + SPDX header check, identical to local `make lint`.
      - run: make lint

  generated:
    name: generated
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: Set up buf (only when generation config exists)
        if: hashFiles('buf.gen.yaml') != ''
        uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          setup_only: true
      - run: make check-generated

  licenses:
    name: licenses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: NOTICE and LICENSE present
        run: test -s LICENSE && test -s NOTICE
      - run: make license-headers
      - run: make licenses

  proto:
    name: proto
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        run: |
          if find proto -name '*.proto' -print -quit | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No .proto files yet; skipping buf lint/format."
          fi
      - if: steps.detect.outputs.present == 'true'
        uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          setup_only: true
      - if: steps.detect.outputs.present == 'true'
        run: |
          buf lint proto
          buf format --diff --exit-code proto

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true # make the image available to trivy below
          tags: protodex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Fails on HIGH/CRITICAL vulnerabilities that have a fix available.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: protodex:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  helm:
    name: helm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HELM_VERSION: v3.19.0
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: detect
        run: |
          charts=$(find deploy -name Chart.yaml -exec dirname {} \; | tr '\n' ' ')
          if [ -n "$charts" ]; then
            echo "charts=$charts" >> "$GITHUB_OUTPUT"
          else
            echo "No Helm chart yet; skipping helm lint/kubeconform."
          fi
      - if: steps.detect.outputs.charts != ''
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: ${{ env.HELM_VERSION }}
      - if: steps.detect.outputs.charts != ''
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - if: steps.detect.outputs.charts != ''
        env:
          CHARTS: ${{ steps.detect.outputs.charts }}
        # Renders each chart with its defaults and with every ci/*-values.yaml
        # (chart-testing convention). CRDs (ServiceMonitor, HTTPRoute) are
        # validated against the datreeio CRDs-catalog schemas.
        run: |
          set -euo pipefail
          go install "github.com/yannh/kubeconform/cmd/kubeconform@${KUBECONFORM_VERSION}"
          kubeconform="$(go env GOPATH)/bin/kubeconform"
          for c in $CHARTS; do
            for v in "" "$c"/ci/*-values.yaml; do
              [ -z "$v" ] || [ -f "$v" ] || continue
              echo "::group::$c ${v:-(defaults)}"
              helm lint --strict "$c" ${v:+-f "$v"}
              helm template ci "$c" ${v:+-f "$v"} | "$kubeconform" -strict -summary \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
              echo "::endgroup::"
            done
          done

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.mod
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_COMMENTS: "false"
      - name: govulncheck
        run: make vuln

  dependency-review:
    name: dependency-review
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.repository.visibility == 'public' ||
       vars.DEPENDENCY_REVIEW_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: Apache-2.0, BSD-2-Clause, BSD-3-Clause, MIT, ISC, MPL-2.0
