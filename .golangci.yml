# SPDX-License-Identifier: Apache-2.0
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  exclusions:
    paths:
      - gen

formatters:
  enable:
    - gofmt
    - goimports

  exclusions:
    paths:
      - gen
