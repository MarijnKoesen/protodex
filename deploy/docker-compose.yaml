#
# One-command quickstart:  docker compose -f deploy/docker-compose.yaml up -d
# See deploy/README.md for which settings are functional today and which are
# wired ahead of the storage/blob/auth work (issue #8 and token auth).
name: protodex

x-hardening: &hardening
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  protodex:
    <<: *hardening
    image: ${PROTODEX_IMAGE:-ghcr.io/marijnkoesen/protodex:latest}
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["serve"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PROTODEX_PORT:-8080}:8080"
    environment:
      # --- functional today (internal/config) ---
      PROTODEX_ADDR: ":8080"
      PROTODEX_LOG_LEVEL: ${PROTODEX_LOG_LEVEL:-info}
      PROTODEX_LOG_FORMAT: json
      # --- functional: SQLite store (#7) ---
      PROTODEX_DB_PATH: /var/lib/protodex/protodex.db
      # --- forward-looking: S3 settings are not read by internal/config yet ---
      PROTODEX_BLOB_BACKEND: s3
      PROTODEX_S3_ENDPOINT: http://seaweedfs:8333
      PROTODEX_S3_REGION: us-east-1
      PROTODEX_S3_BUCKET: ${PROTODEX_S3_BUCKET:-protodex}
      PROTODEX_S3_FORCE_PATH_STYLE: "true"
      PROTODEX_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-protodex}
      PROTODEX_S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-protodex-dev-secret}
    volumes:
      - protodex-data:/var/lib/protodex
    tmpfs:
      - /tmp
    depends_on:
      bucket-init:
        condition: service_completed_successfully

  seaweedfs:
    <<: *hardening
    # Single-process SeaweedFS (master + volume + filer + S3 gateway on :8333).
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:latest}
    # Run as the image's `seaweed` user so the entrypoint skips its root-only
    # chown + su-exec step, which cap_drop ALL forbids (setgroups: EPERM).
    user: "1000:1000"
    command: ["server", "-dir=/data", "-s3", "-master.volumeSizeLimitMB=1024"]
    restart: unless-stopped
    environment:
      # Defines the S3 admin identity of the gateway.
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-protodex}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-protodex-dev-secret}
    volumes:
      - seaweedfs-data:/data
    tmpfs:
      - /tmp
    healthcheck:
      # S3 gateway answers (403/200) once up; the image is busybox-based.
      test: ["CMD-SHELL", "wget -q -O /dev/null --spider http://127.0.0.1:8333/ || wget -S -O /dev/null http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 5s

  bucket-init:
    <<: *hardening
    image: ${SEAWEEDFS_IMAGE:-chrislusf/seaweedfs:latest}
    restart: "no"
    environment:
      BUCKET: ${PROTODEX_S3_BUCKET:-protodex}
    tmpfs:
      - /tmp
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        # Idempotent: a re-run of `up` must not fail on an existing bucket.
        if ! out=$$(echo "s3.bucket.create -name $$BUCKET" | weed shell -master=seaweedfs:9333 2>&1); then
          echo "$$out"
          echo "$$out" | grep -q "already exists" || exit 1
        fi
    depends_on:
      seaweedfs:
        condition: service_healthy

volumes:
  protodex-data:
  seaweedfs-data:
