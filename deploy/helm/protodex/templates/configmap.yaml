{{- include "protodex.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "protodex.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "protodex.labels" . | nindent 4 }}
data:
  # Functional today (internal/config).
  PROTODEX_ADDR: ":8080"
  PROTODEX_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  PROTODEX_LOG_FORMAT: {{ .Values.config.logFormat | quote }}
  PROTODEX_MAX_REQUEST_BYTES: {{ .Values.config.maxRequestBytes | int64 | toString | quote }}
  PROTODEX_SHUTDOWN_TIMEOUT: {{ .Values.config.shutdownTimeout | quote }}
  PROTODEX_DB_PATH: {{ .Values.config.dbPath | quote }}
  PROTODEX_TRACING_ENABLED: {{ .Values.config.tracing.enabled | toString | quote }}
  {{- with .Values.config.tracing.otlpEndpoint }}
  PROTODEX_OTLP_ENDPOINT: {{ . | quote }}
  {{- end }}
  # Forward-looking (blob store, issue #8); names follow deploy/docker-compose.yaml.
  PROTODEX_BLOB_BACKEND: "s3"
  {{- with (include "protodex.s3.endpoint" .) }}
  PROTODEX_S3_ENDPOINT: {{ . | quote }}
  {{- end }}
  PROTODEX_S3_REGION: {{ .Values.s3.region | quote }}
  PROTODEX_S3_BUCKET: {{ .Values.s3.bucket | quote }}
  PROTODEX_S3_FORCE_PATH_STYLE: {{ include "protodex.s3.forcePathStyle" . | quote }}
{{- if .Values.litestream.enabled }}
{{- $replica := dict "type" "s3" "bucket" .Values.s3.bucket "path" .Values.litestream.path "region" .Values.s3.region "sync-interval" .Values.litestream.syncInterval "force-path-style" (eq (include "protodex.s3.forcePathStyle" .) "true") }}
{{- with (include "protodex.s3.endpoint" .) }}
{{- $_ := set $replica "endpoint" . }}
{{- end }}
{{- $cfg := dict "dbs" (list (dict "path" .Values.config.dbPath "replica" $replica)) }}
{{- if .Values.litestream.metrics.enabled }}
{{- $_ := set $cfg "addr" (printf ":%d" (int .Values.litestream.metrics.port)) }}
{{- end }}
{{- $cfg = mergeOverwrite $cfg (deepCopy .Values.litestream.extraConfig) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "protodex.fullname" . }}-litestream
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "protodex.labels" . | nindent 4 }}
data:
  litestream.yml: |
    # Generated by the protodex chart. Credentials come from
    # LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY or the ambient
    # AWS credential chain (IRSA, Pod Identity).
    {{- toYaml $cfg | nindent 4 }}
{{- end }}
