{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "protodex.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "protodex.labels" . | nindent 4 }}
type: Opaque
data:
  {{- with .Values.s3.accessKeyId }}
  {{ $.Values.secretKeys.s3AccessKeyId }}: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.s3.secretAccessKey }}
  {{ $.Values.secretKeys.s3SecretAccessKey }}: {{ . | b64enc | quote }}
  {{- end }}
  {{- with .Values.auth.bootstrapAdminToken }}
  {{ $.Values.secretKeys.bootstrapAdminToken }}: {{ . | b64enc | quote }}
  {{- end }}
{{- end }}
