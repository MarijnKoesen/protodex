# SPDX-License-Identifier: Apache-2.0
# CI: external Secret + existing PVC + IRSA, no NetworkPolicy egress limits.
existingSecret: protodex-credentials
persistence:
  existingClaim: protodex-data
serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/protodex
s3:
  bucket: my-protodex-bucket
  region: eu-west-1
networkPolicy:
  egress:
    allowAll: true
